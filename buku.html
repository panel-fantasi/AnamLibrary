<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AnamLibrary | Data Buku</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Dexie -->
  <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
  
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/buku.js"></script>
</head>
<body>
  
  <main>
    
    <header>
      <h1>📚 Anam<span>Library</span></h1>
      <nav>
        <a href="index.html" class="nav-btn">Beranda</a>
        <a href="anggota.html" class="nav-btn">Anggota</a>
        <a href="peminjaman.html" class="nav-btn">Peminjaman</a>
      </nav>
    </header>
    
    <div class="divider"></div>
  
    <section class="book-section">
      <h2>📘 Tambah Buku</h2>
  
      <div class="input-container">
        <input type="text" id="isbn" placeholder="Masukkan ISBN"><br>
        <input type="text" id="judul" placeholder="Masukkan Judul Buku"><br>
        <input type="text" id="penulis" placeholder="Masukkan Nama Penulis"><br>
        <button onclick="simpanBuku()">Simpan Data Buku</button>
      </div>
    
      <div class="divider"></div>
      
      <h2>📘 Data Buku</h2>
      
      <input type="text" id="search" placeholder="Cari data..." onkeyup="search()">
    
      <div class="table-container">
        <table border="1" cellpadding="5">
          <thead>
            <tr>
              <th>ID</th>
              <th>ISBN</th>
              <th>Judul</th>
              <th>Penulis</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelBuku"></tbody>
        </table>
      </div>
    </section>
    
    <div class="divider"></div>
    
    <footer>
      <p>
        &copy; 2026 | AnamLibrary - Perpustakaan Resmi<br>
        All Rights Reserved
      </p>
    </footer>
    
  </main>

</body>
</html>
