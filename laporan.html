<!DOCTYPE html>
<html lang="id">

<body>

    <header>
      <h1>📚 Anam<span>Library</span></h1>

        <button class="nav-btn" id="printLaporan">Print Laporan</button>

              <th>Buku</th>

              <th>Status</th>
              <th>Tgl Pinjam</th>
              <th>Tgl Kembali</th>
            </tr>
          </thead>
          <tbody id="tabelLaporan"></tbody>
        </table>
      </div>
    </section>
    
    <div class="divider"></div>
    
    <footer>
      <p>
